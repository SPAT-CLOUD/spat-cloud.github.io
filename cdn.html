
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Form Post</title>
</head>
	<style>
		.none{
			display:none;
		}
		.show{
			display:block;
		}
		.err{
			color:red;
		}
		#idres
		{
			display:none;
			color:green;
		}
	</style>
<body>
	<h1>PERSONAL CLOUD FILE UPLOAD SPAT-CLOUD (max 300KB)</h1>
	<p id="idres" >WAIT UPLOADING ...</p>
	<form onsubmit="return false">
	<input type="file" name="stream" id="san">
<input type="submit" value="upload">
</form>

</body>
<script>
	var Fr = document.getElementById('san');
	var Flo = document.getElementById('idres');
	
	var Fire = "https://foxyware.pythonanywhere.com/api/tmp_img";
	var Frm = document.forms;
	Frm[0].getElementsByTagName('input')[1].addEventListener('click',Sub);
	function Sub(){
		fl = Fr.files[0];
		FrmDat = new FormData();
		FrmDat.append('stream',fl);
		fun = fetch(Fire,{method:'POST',
			body:FrmDat
		});
		fun.then(u=>u.text()).then(c=>{
			Flo.classList.toggle('show');
			Flo.innerText = c;
		}).catch(a=>{
			Flo.classList.toggle('err');
			Flo.innerText = a;
		});
	}

</script>
</html>
