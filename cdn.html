
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Form Post</title>
</head>
	<style>
		*{
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			border:0;
			color:#ccc;
			background-color: rgb(40, 34, 34);
		}
		.none{
			display:none;
		}
		body.h1{
			padding: .7em;
		}
		.show{
			display:block;
		}
		.err{
			color:red;
		}
		#MTR{
			padding: .7em;
		}
		#idres
		{
			/* display:none; */
			padding: 1em;
			color:rgb(26, 204, 26);
		}
	</style>
<body>
	<h1>PERSONAL CLOUD FILE UPLOAD SPAT-CLOUD (max 300KB)</h1>
	<p id="idres" class="show">Upload UR FILES BY CHOOSING FILES</p>
	<form onsubmit="return false;" id="MTR" method="POST">
		<input type="file" name="stream" id="san">
		<input type="submit" value="upload" onclick="Sub()">
	</form>
<script>
	var Fr = document.getElementById('san');
	var Flo = document.getElementById('idres');
	
	var Fire = "https://foxyware.pythonanywhere.com/api/tmp_img";
	var Frm = document.getElementById('MTR');
	// Frm.getElementsByTagName('input')[1].addEventListener('click',Sub);
	function Sub(){
		if(Fr.files.length!=0){
		var fl = Fr.files[0];
        if(fl.size < 300*1024){
		var FrmDat = new FormData();
		FrmDat.append('stream',fl);
		var fun = fetch(Fire,{method:'POST',
			body:FrmDat
		});
		// Flo.classList.toggle('show');
		fun.then(u=>u.text()).then(c=>{
			Flo.classList.toggle('show');
			Flo.innerText = c;
		})
		}else{
			alert(`FILE SIZE OVERLOADED MIN = 300 KB BUT SIZE = ${fl.size}`);
		}
		return false;
		}else{
			alert("NO FILES CHOOSED or BUFFER OVERFLOW");
			return false;
		}
	}

</script>

</body>
</html>
